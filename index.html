<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Расписание 8А</title>
  <style>
    :root { color-scheme: light; --purple:#6d35d5; --ink:#29213b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:linear-gradient(145deg,#f4eaff,#8c55ed); color:var(--ink); }
    main { width:min(100%,520px); background:#fff; border-radius:24px; padding:28px;
      box-shadow:0 18px 50px #3b167733; text-align:center; }
    .icon { font-size:52px; }
    h1 { margin:8px 0; color:var(--purple); font-size:clamp(28px,7vw,42px); }
    p { line-height:1.55; color:#655b75; }
    .pill { display:inline-block; margin-top:10px; padding:10px 16px; border-radius:999px;
      background:#f0e8ff; color:#6030bb; font-weight:600; }
    footer { margin-top:22px; font-size:13px; color:#938aa0; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📚</div>
    <h1>Расписание 8А</h1>
    <p>Страница школьного расписания готова к настройке.</p>
    <p>Скоро здесь появятся расписание на сегодня и на всю неделю.</p>
    <span class="pill">Мини-приложение в разработке</span>
    <footer>Открой эту страницу через Telegram после подключения к боту.</footer>
  </main>
</body>
</html>
